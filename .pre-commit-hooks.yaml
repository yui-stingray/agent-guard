- id: agent-guard-evidence
  name: agent-guard evidence report
  description: Generate deterministic agent-guard evidence using the recommended preset.
  entry: agent-guard
  language: python
  args:
    - report
    - --root
    - .
    - --context-policy
    - .agent-guard/context-policy.yaml
    - --evidence-preset
    - recommended
    - --format
    - markdown
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push, manual]

- id: agent-guard-context
  name: agent-guard context check
  description: Check agent context files for unsafe agent instructions.
  entry: agent-guard
  language: python
  args:
    - context
    - check
    - --root
    - .
    - --policy
    - .agent-guard/context-policy.yaml
    - --json
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push, manual]

- id: agent-guard-path
  name: agent-guard path check
  description: Check repository paths for private or local-only artifacts.
  entry: agent-guard
  language: python
  args:
    - path
    - check
    - --root
    - .
    - --policy
    - .agent-guard/path-policy.yaml
    - --json
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push, manual]

- id: agent-guard-content
  name: agent-guard content check
  description: Check configured text surfaces for unsafe agent-facing instructions.
  entry: agent-guard
  language: python
  args:
    - content
    - check
    - --repo-root
    - .
    - --policy
    - .agent-guard/content-policy.yaml
    - --mode
    - registered
    - --scan-dir
    - .
    - --json
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push, manual]
