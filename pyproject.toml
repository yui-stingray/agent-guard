# Where: pyproject.toml
# What: build + metadata for the agent-guard package.
# Why: keep the first extraction small — one scanner, one CLI, one runtime dep.

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "yui-agent-guard"
version = "0.2.2"
description = "Static repository guardrails for agent-touched codebases."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "yui-stingray" }]
keywords = ["agent", "guardrails", "security", "policy", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "jsonschema>=4,<5",
    "pre-commit>=3,<5",
    "build>=1.2,<2",
    "twine>=6,<7",
]

[project.urls]
Repository = "https://github.com/yui-stingray/agent-guard"
Issues = "https://github.com/yui-stingray/agent-guard/issues"

[project.scripts]
agent-guard = "agent_guard.cli:main"

[tool.hatch.build]
exclude = [
    "/execution-notes.md",
    "/.venv/",
    "/.venv312/",
    "/.venv-py312/",
    "/__pycache__/",
    "/.pytest_cache/",
    "/build/",
    "/dist/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -s"
