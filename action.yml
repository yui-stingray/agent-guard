name: agent-guard evidence
description: Generate deterministic agent-guard evidence for agent-touched repositories.
branding:
  icon: shield
  color: green
inputs:
  root:
    description: Repository root to scan.
    required: false
    default: "."
  python-version:
    description: Python version used to install and run agent-guard.
    required: false
    default: "3.12"
  package-spec:
    description: Optional package spec override. Empty installs the checked-out action package.
    required: false
    default: ""
  context-policy:
    description: Path to the agent context policy, relative to root unless absolute.
    required: false
    default: ".agent-guard/context-policy.yaml"
  path-policy:
    description: Path to the path policy, relative to root unless absolute.
    required: false
    default: ".agent-guard/path-policy.yaml"
  content-policy:
    description: Path to the content policy, relative to root unless absolute.
    required: false
    default: ".agent-guard/content-policy.yaml"
  mcp-policy:
    description: Reviewed MCP policy path required for recommended evidence.
    required: false
    default: ".agent-guard/mcp-policy.yaml"
  content-scan-dir:
    description: Directory scanned by the content guard.
    required: false
    default: "."
  workflow-policy:
    description: Path to the workflow policy, relative to root unless absolute.
    required: false
    default: ".agent-guard/workflow-policy.yaml"
  digest-policy:
    description: Optional digest policy path. It is used only when the file exists.
    required: false
    default: ".agent-guard/context-digest-policy.yaml"
  base-ref:
    description: >-
      Optional git ref used to flag baseline-sensitive guard changes. The caller
      must fetch this ref before running the action.
    required: false
    default: ""
  evidence-dir:
    description: Directory where JSON and Markdown evidence files are written, relative to root unless absolute.
    required: false
    default: ".agent-guard/evidence"
  github-annotations:
    description: Emit sanitized GitHub workflow annotations.
    required: false
    default: "true"
  conformance-profile:
    description: Conformance profile checked against the generated recommended evidence report.
    required: false
    default: "recommended"
outputs:
  evidence-dir:
    description: Directory containing generated evidence artifacts.
    value: ${{ steps.evidence.outputs.evidence-dir }}
  report-json:
    description: Generated JSON evidence report path.
    value: ${{ steps.evidence.outputs.report-json }}
  report-markdown:
    description: Generated Markdown evidence report path.
    value: ${{ steps.evidence.outputs.report-markdown }}
  report-sarif:
    description: Generated SARIF evidence report path.
    value: ${{ steps.evidence.outputs.report-sarif }}
  status:
    description: Captured agent-guard exit status.
    value: ${{ steps.evidence.outputs.status }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install agent-guard
      shell: bash
      env:
        AGENT_GUARD_PACKAGE_SPEC: ${{ inputs.package-spec }}
      run: |
        validate_no_control_chars() {
          input_name="$1"
          input_value="$2"
          AGENT_GUARD_VALIDATE_VALUE="$input_value" python - "$input_name" <<'PY'
        import os
        import sys

        name = sys.argv[1]
        value = os.environ.get("AGENT_GUARD_VALIDATE_VALUE", "")
        if any(ord(char) < 32 or ord(char) == 127 for char in value):
            print(f"::error::{name} must not contain control characters")
            raise SystemExit(2)
        PY
        }

        validate_no_control_chars "package-spec" "$AGENT_GUARD_PACKAGE_SPEC" || exit 2

        python -m pip install --upgrade pip
        if [ -n "$AGENT_GUARD_PACKAGE_SPEC" ]; then
          python -m pip install "$AGENT_GUARD_PACKAGE_SPEC"
        else
          python -m pip install "$GITHUB_ACTION_PATH"
        fi
    - id: evidence
      name: Generate deterministic evidence
      shell: bash
      env:
        AGENT_GUARD_BASE_REF: ${{ inputs.base-ref }}
        AGENT_GUARD_ROOT: ${{ inputs.root }}
        AGENT_GUARD_CONTEXT_POLICY: ${{ inputs.context-policy }}
        AGENT_GUARD_PATH_POLICY: ${{ inputs.path-policy }}
        AGENT_GUARD_CONTENT_POLICY: ${{ inputs.content-policy }}
        AGENT_GUARD_MCP_POLICY: ${{ inputs.mcp-policy }}
        AGENT_GUARD_CONTENT_SCAN_DIR: ${{ inputs.content-scan-dir }}
        AGENT_GUARD_WORKFLOW_POLICY: ${{ inputs.workflow-policy }}
        AGENT_GUARD_DIGEST_POLICY: ${{ inputs.digest-policy }}
        AGENT_GUARD_EVIDENCE_DIR: ${{ inputs.evidence-dir }}
        AGENT_GUARD_GITHUB_ANNOTATIONS: ${{ inputs.github-annotations }}
        AGENT_GUARD_CONFORMANCE_PROFILE: ${{ inputs.conformance-profile }}
      run: |
        set +e
        status=0
        root="${AGENT_GUARD_ROOT:-.}"
        conformance_profile="${AGENT_GUARD_CONFORMANCE_PROFILE:-recommended}"
        github_annotations="${AGENT_GUARD_GITHUB_ANNOTATIONS:-true}"

        validate_no_control_chars() {
          input_name="$1"
          input_value="$2"
          AGENT_GUARD_VALIDATE_VALUE="$input_value" python - "$input_name" <<'PY'
        import os
        import sys

        name = sys.argv[1]
        value = os.environ.get("AGENT_GUARD_VALIDATE_VALUE", "")
        if any(ord(char) < 32 or ord(char) == 127 for char in value):
            print(f"::error::{name} must not contain control characters")
            raise SystemExit(2)
        PY
        }

        write_output() {
          output_name="$1"
          output_value="$2"
          delimiter="agent_guard_${output_name}_$$_EOF"
          if [ "$output_value" = "$delimiter" ]; then
            delimiter="${delimiter}_ALT"
          fi
          {
            echo "${output_name}<<${delimiter}"
            printf '%s\n' "$output_value"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
        }

        validate_no_control_chars "conformance-profile" "$conformance_profile" || exit 2
        validate_no_control_chars "github-annotations" "$github_annotations" || exit 2
        validate_no_control_chars "root" "$root" || exit 2
        validate_no_control_chars "context-policy" "$AGENT_GUARD_CONTEXT_POLICY" || exit 2
        validate_no_control_chars "path-policy" "$AGENT_GUARD_PATH_POLICY" || exit 2
        validate_no_control_chars "content-policy" "$AGENT_GUARD_CONTENT_POLICY" || exit 2
        validate_no_control_chars "mcp-policy" "$AGENT_GUARD_MCP_POLICY" || exit 2
        validate_no_control_chars "content-scan-dir" "$AGENT_GUARD_CONTENT_SCAN_DIR" || exit 2
        validate_no_control_chars "workflow-policy" "$AGENT_GUARD_WORKFLOW_POLICY" || exit 2
        validate_no_control_chars "digest-policy" "$AGENT_GUARD_DIGEST_POLICY" || exit 2
        validate_no_control_chars "evidence-dir" "$AGENT_GUARD_EVIDENCE_DIR" || exit 2
        validate_no_control_chars "base-ref" "$AGENT_GUARD_BASE_REF" || exit 2

        case "$conformance_profile" in
          minimal|recommended|strict) ;;
          *)
            echo "::error::conformance-profile must be minimal, recommended, or strict"
            exit 2
            ;;
        esac

        case "$github_annotations" in
          true|false) ;;
          *)
            echo "::error::github-annotations must be true or false"
            exit 2
            ;;
        esac

        policy_path() {
          case "$1" in
            /*) printf '%s\n' "$1" ;;
            *) printf '%s/%s\n' "${root%/}" "$1" ;;
          esac
        }

        evidence_dir="$(policy_path "$AGENT_GUARD_EVIDENCE_DIR")"
        report_json="${evidence_dir%/}/agent-guard-report.json"
        report_markdown="${evidence_dir%/}/agent-guard-report.md"
        report_sarif="${evidence_dir%/}/agent-guard-results.sarif"
        mkdir -p "$evidence_dir"
        raw_parent="${RUNNER_TEMP:-/tmp}"
        mkdir -p "$raw_parent"
        raw_dir="$(mktemp -d "$raw_parent/agent-guard-raw.XXXXXX")"
        trap 'rm -rf "$raw_dir"' EXIT

        path_exists() {
          test -f "$1"
        }

        record_status() {
          code="$1"
          if [ "$code" -eq 2 ] || { [ "$code" -ne 0 ] && [ "$status" -eq 0 ]; }; then
            status="$code"
          fi
        }

        should_use_mcp_policy() {
          [ -n "$mcp_policy_arg" ] && {
            [ "$mcp_policy_arg" != "$default_mcp_policy_arg" ] || path_exists "$mcp_policy"
          }
        }

        context_policy_arg="$AGENT_GUARD_CONTEXT_POLICY"
        path_policy_arg="$AGENT_GUARD_PATH_POLICY"
        content_policy_arg="$AGENT_GUARD_CONTENT_POLICY"
        workflow_policy_arg="$AGENT_GUARD_WORKFLOW_POLICY"
        digest_policy_arg="$AGENT_GUARD_DIGEST_POLICY"
        default_mcp_policy_arg=".agent-guard/mcp-policy.yaml"
        context_policy="$(policy_path "$context_policy_arg")"
        path_policy="$(policy_path "$path_policy_arg")"
        content_policy="$(policy_path "$content_policy_arg")"
        mcp_policy=""
        mcp_policy_arg=""
        if [ -n "$AGENT_GUARD_MCP_POLICY" ]; then
          mcp_policy="$(policy_path "$AGENT_GUARD_MCP_POLICY")"
          mcp_policy_arg="$AGENT_GUARD_MCP_POLICY"
        fi
        content_scan_dir="$AGENT_GUARD_CONTENT_SCAN_DIR"
        workflow_policy="$(policy_path "$workflow_policy_arg")"
        digest_policy="$(policy_path "$digest_policy_arg")"
        base_ref="${AGENT_GUARD_BASE_REF:-}"

        agent-guard context check --root "$root" --policy "$context_policy_arg" --json > "$raw_dir/context.json"
        record_status "$?"

        if path_exists "$path_policy"; then
          agent-guard path check --root "$root" --policy "$path_policy_arg" --json > "$raw_dir/path.json"
          record_status "$?"
        fi

        if path_exists "$content_policy"; then
          agent-guard content check \
            --repo-root "$root" \
            --policy "$content_policy_arg" \
            --mode registered \
            --scan-dir "$content_scan_dir" \
            --json > "$raw_dir/content.json"
          record_status "$?"
        fi

        mcp_args=(--root "$root")
        if should_use_mcp_policy; then
          mcp_args+=(--policy "$mcp_policy_arg")
        fi
        agent-guard mcp check "${mcp_args[@]}" --json > "$raw_dir/mcp.json"
        record_status "$?"

        agent-guard surface inventory \
          --root "$root" \
          --context-policy "$context_policy_arg" \
          --schema-version v2 \
          --json > "${evidence_dir%/}/agent-surface-inventory.json"
        record_status "$?"

        if path_exists "$workflow_policy"; then
          agent-guard workflow check --root "$root" --policy "$workflow_policy_arg" --json > "$raw_dir/workflow.json"
          record_status "$?"
        fi

        drift_args=(--root "$root" --profile recommended --schema-version v2)
        if [ -n "$base_ref" ]; then
          drift_args+=(--base-ref "$base_ref")
        fi
        agent-guard drift check "${drift_args[@]}" --json > "$raw_dir/drift.json"
        record_status "$?"

        report_args=(--root "$root" --context-policy "$context_policy_arg" --evidence-preset recommended)
        if path_exists "$path_policy"; then
          report_args+=(--path-policy "$path_policy_arg")
        fi
        if path_exists "$content_policy"; then
          report_args+=(--content-policy "$content_policy_arg" --content-scan-dir "$content_scan_dir")
        fi
        if should_use_mcp_policy; then
          report_args+=(--mcp-policy "$mcp_policy_arg")
        fi
        if path_exists "$workflow_policy"; then
          report_args+=(--workflow-policy "$workflow_policy_arg")
        fi
        if path_exists "$digest_policy"; then
          report_args+=(--digest-policy "$digest_policy_arg")
        fi
        if [ -n "$base_ref" ]; then
          report_args+=(--drift-base-ref "$base_ref")
        fi

        report_args+=(--conformance-profile "$conformance_profile")

        agent-guard report "${report_args[@]}" --format json --output "$report_json"
        record_status "$?"

        agent-guard render-report --root "$root" --input "$report_json" --format markdown --output "$report_markdown"
        record_status "$?"

        agent-guard render-report --root "$root" --input "$report_json" --format sarif --output "$report_sarif"
        record_status "$?"

        agent-guard conformance check \
          --root "$root" \
          --evidence "$report_json" \
          --profile "$conformance_profile" \
          --json > "${evidence_dir%/}/agent-guard-conformance.json"
        record_status "$?"

        agent-guard evidence-pack manifest \
          --root "$root" \
          --report "$report_json" \
          --artifact "$report_json" \
          --json > "${evidence_dir%/}/agent-guard-evidence-pack.json"
        record_status "$?"

        if [ "$github_annotations" = "true" ]; then
          agent-guard render-report --root "$root" --input "$report_json" --format github-annotations
          record_status "$?"
        fi

        {
          write_output "evidence-dir" "$evidence_dir"
          write_output "report-json" "$report_json"
          write_output "report-markdown" "$report_markdown"
          write_output "report-sarif" "$report_sarif"
          write_output "status" "$status"
        }

        exit "$status"
