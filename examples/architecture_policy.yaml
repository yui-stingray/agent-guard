# Where: examples/architecture_policy.yaml
# What: example policy for the API surface guard.
# Why: make the MVP scanner runnable without copying config from ai-company.

scan:
  include:
    - src
    - scripts
  exclude:
    - scripts/build_instructions.sh

policy:
  allowed_api_patterns:
    - "^https://ntfy\\.sh/"

  forbidden_api_patterns:
    - "^https://api\\.openai\\.com/"
    - "^https://api\\.anthropic\\.com/"
    - "^https://generativelanguage\\.googleapis\\.com/"
    - "^https://api\\.moonshot\\.cn/"
