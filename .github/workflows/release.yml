# Where: .github/workflows/release.yml
# What: build sdist+wheel and publish to PyPI on tag push, via Trusted Publishing.
# Why: make agent-guard consumable from downstream CI without long-lived PyPI tokens.

name: release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI instead of build-only dry run'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

jobs:
  validate-release-request:
    name: validate release request
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual publish ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.publish }}" = "true" ] \
             && [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::manual publish=true must be run against a v* tag ref, not ${GITHUB_REF}"
            exit 1
          fi
          echo "release request accepted for ${GITHUB_REF}"

  build:
    name: build sdist + wheel
    needs: validate-release-request
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Assert tag matches package version
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python scripts/check_release_version.py "$TAG_NAME"
      - name: Check PyPI release state
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_pypi_release_state.py
      - name: Require current protected master with successful CI
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          mapfile -t conclusions < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch master \
              --commit "$GITHUB_SHA" \
              --event push \
              --status completed \
              --limit 10 \
              --json conclusion \
              --jq '.[].conclusion'
          )
          args=()
          for conclusion in "${conclusions[@]}"; do
            args+=(--ci-conclusion "$conclusion")
          done
          python scripts/check_release_source.py \
            --tag-sha "$GITHUB_SHA" \
            --master-sha "$(git rev-parse origin/master)" \
            "${args[@]}"
      - name: Check changelog entry
        run: python scripts/check_changelog.py --release
      - name: Install locked release build tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements/release-tools.txt
      - name: Verify release tool dependency consistency
        run: python -m pip check
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Verify metadata (twine check)
        run: python -m twine check dist/*
      - name: Verify wheel public contract
        run: python scripts/check_wheel_contract.py
      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
      - name: Checkout exact Toolkit compatibility contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: yui-stingray/agent-safety-toolkit-example
          ref: e78944091264fd927e7c0fe6fae7bc4eb3de2ec0
          path: .candidate-toolkit
          persist-credentials: false
      - name: Verify Toolkit candidate compatibility
        run: >-
          python .candidate-toolkit/scripts/check_candidate_wheel_compatibility.py
          --wheel dist/yui_agent_guard-*.whl

  attest:
    name: attest release distributions
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Generate provenance attestations for release distributions
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: dist/*

  publish:
    name: publish to PyPI (OIDC)
    needs: [build, attest]
    if: github.event_name == 'push' || (inputs.publish && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yui-agent-guard
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify published package from PyPI
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          success=false
          for attempt in {1..10}; do
            target="$(mktemp -d)"
            if python scripts/check_pypi_release_state.py \
                 --expect-present --version "$version" \
               && python -m pip install --no-cache-dir --target "$target" "yui-agent-guard==${version}"; then
              PYTHONPATH="$target" PACKAGE_VERSION="$version" python - <<'PY'
          import os
          import agent_guard

          expected = os.environ["PACKAGE_VERSION"]
          assert agent_guard.__version__ == expected, (agent_guard.__version__, expected)
          PY
              success=true
              break
            fi
            echo "PyPI post-publish check attempt ${attempt} failed; waiting for propagation"
            rm -rf "$target"
            sleep 15
          done
          if [ "$success" != "true" ]; then
            echo "::error::published package was not installable from PyPI after retries"
            exit 1
          fi
