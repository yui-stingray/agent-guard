# Where: .github/workflows/release.yml
# What: build sdist+wheel and publish to PyPI on tag push, via Trusted Publishing.
# Why: make agent-guard consumable from downstream CI without long-lived PyPI tokens.

name: release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI instead of build-only dry run'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-release-request:
    name: validate release request
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual publish ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.publish }}" = "true" ] \
             && [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::manual publish=true must be run against a v* tag ref, not ${GITHUB_REF}"
            exit 1
          fi
          echo "release request accepted for ${GITHUB_REF}"

  build:
    name: build sdist + wheel
    needs: validate-release-request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Assert tag matches package version
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python scripts/check_release_version.py "$TAG_NAME"
      - name: Check PyPI release state
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_pypi_release_state.py
      - name: Check changelog entry
        run: python scripts/check_changelog.py
      - name: Install build + twine
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Verify metadata (twine check)
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (OIDC)
    needs: build
    if: github.event_name == 'push' || (inputs.publish && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yui-agent-guard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify published package from PyPI
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          success=false
          for attempt in {1..10}; do
            target="$(mktemp -d)"
            if python -m pip install --no-cache-dir --target "$target" "yui-agent-guard==${version}"; then
              PYTHONPATH="$target" PACKAGE_VERSION="$version" python - <<'PY'
          import os
          import agent_guard

          expected = os.environ["PACKAGE_VERSION"]
          assert agent_guard.__version__ == expected, (agent_guard.__version__, expected)
          PY
              success=true
              break
            fi
            echo "PyPI install check attempt ${attempt} failed; waiting for index propagation"
            rm -rf "$target"
            sleep 15
          done
          if [ "$success" != "true" ]; then
            echo "::error::published package was not installable from PyPI after retries"
            exit 1
          fi
