# Where: .github/workflows/github-release.yml
# What: create or update a GitHub Release from CHANGELOG.md after PyPI release succeeds.
# Why: keep GitHub release notes decoupled from PyPI upload so immutable PyPI
#      versions do not make release-note retries unsafe.

name: github-release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v0.1.1'
        required: true
        type: string
  workflow_run:
    workflows: ['release']
    types: [completed]

permissions:
  contents: read

jobs:
  prepare-github-release:
    name: prepare GitHub release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify upstream PyPI publication
        id: upstream
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          published_count="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
              --jq '[.jobs[] | select(.name == "publish to PyPI (OIDC)" and .conclusion == "success")] | length'
          )"
          if [[ "$published_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::upstream run did not complete PyPI publication"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_PUBLISHED: ${{ steps.upstream.outputs.published }}
          UPSTREAM_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] \
             && { [ "$UPSTREAM_EVENT" != "push" ] \
                  || [ "$UPSTREAM_PUBLISHED" != "true" ]; }; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            tag="$UPSTREAM_TAG"
          else
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::not a version tag release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || {
            echo "::error::tag not found: ${tag}"
            exit 1
          }
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            tag_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            master_sha="$(git rev-parse "refs/remotes/origin/master^{commit}")"
            if [ "$tag_sha" != "$UPSTREAM_HEAD_SHA" ] \
               || ! git merge-base --is-ancestor "$tag_sha" "$master_sha"; then
              echo "::notice::upstream release ref is not on protected master history"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          {
            echo "publish=true"
            echo "tag=${tag}"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.tag.outputs.publish == 'true'
        with:
          python-version: '3.12'

      - name: Extract release notes
        if: steps.tag.outputs.publish == 'true'
        run: >-
          python scripts/check_changelog.py
          --version "${{ steps.tag.outputs.version }}"
          --write-notes release-notes.md

      - name: Verify published PyPI version
        if: steps.tag.outputs.publish == 'true'
        run: >-
          python scripts/check_pypi_release_state.py
          --expect-present
          --version "${{ steps.tag.outputs.version }}"

      - name: Upload release notes artifact
        if: steps.tag.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish-github-release:
    name: publish GitHub release
    needs: prepare-github-release
    if: needs.prepare-github-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release notes artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
          path: .

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-github-release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi
