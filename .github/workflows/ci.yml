# Where: .github/workflows/ci.yml
# What: run workflow linting, tests, and packaging checks on every push to master and every PR.
# Why: keep the extracted guard package safe while the API surface is still moving.

name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - uses: devops-actions/actionlint@469810fd82c015d3c43815cd2b0e4d02eecc4819  # v0.1.11

  release-contract:
    name: release toolchain contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: Install locked release build tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements/release-tools.txt
      - name: Verify release tool dependency consistency
        run: python -m pip check
      - name: Build sdist + wheel
        run: python -m build --no-isolation
      - name: Verify metadata (twine check)
        run: python -m twine check dist/*
      - name: Verify wheel public contract
        run: python scripts/check_wheel_contract.py

  action-smoke:
    name: packaged action smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.4', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - id: agent-guard
        uses: ./
        with:
          python-version: ${{ matrix.python-version }}
          github-annotations: "false"
      - name: Verify packaged action consumer contract
        env:
          ACTION_READY: ${{ steps.agent-guard.outputs.ready }}
          ACTION_STATUS: ${{ steps.agent-guard.outputs.status }}
          EVIDENCE_DIR: ${{ steps.agent-guard.outputs.evidence-dir }}
          REPORT_JSON: ${{ steps.agent-guard.outputs.report-json }}
          REPORT_MARKDOWN: ${{ steps.agent-guard.outputs.report-markdown }}
          REPORT_SARIF: ${{ steps.agent-guard.outputs.report-sarif }}
        run: |
          set -euo pipefail
          test "$ACTION_READY" = "true"
          test "$ACTION_STATUS" = "0"
          test -f "$REPORT_JSON"
          test -f "$REPORT_MARKDOWN"
          test -f "$REPORT_SARIF"
          AGENT_GUARD_ROOT=. \
            AGENT_GUARD_EVIDENCE_DIR="$EVIDENCE_DIR" \
            AGENT_GUARD_REPORT_JSON="$REPORT_JSON" \
            sh examples/evidence_contracts_ci.sh consume

  action-smoke-status:
    name: packaged action smoke
    if: ${{ always() }}
    needs: action-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every packaged Action smoke job to pass
        env:
          ACTION_SMOKE_RESULT: ${{ needs.action-smoke.result }}
        run: test "$ACTION_SMOKE_RESULT" = "success"

  windows-cli-smoke:
    name: Windows CLI contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: python -m pip install -e ".[dev]"
      - name: Verify Windows process and path boundaries
        run: >-
          python -m pytest -q
          tests/test_bounded_git.py::test_bounded_process_kills_descendant_holding_stdout_and_joins_reader
          tests/test_bounded_scan.py::test_isolated_scan_supports_spawn_context
          tests/test_bounded_scan.py::test_default_isolated_scan_supports_standalone_programmatic_call
          tests/test_public_api.py::test_public_scanners_support_unguarded_consumer_with_guarded_parity
          tests/test_content_guard.py::test_new_mode_applies_windows_git_filename_rejections
          tests/cli/test_evidence_pack.py::test_audit_event_artifacts_preserve_nested_paths_for_duplicate_basenames
          tests/test_windows_file_boundaries.py
      - name: Verify Windows CLI report consumer contract
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}\\agent-guard-windows-report.json"
          set +e
          python -m agent_guard.cli report \
            --root . \
            --context-policy .agent-guard/context-policy.yaml \
            --evidence-preset recommended \
            --mcp-policy .agent-guard/mcp-policy.yaml \
            --digest-policy .agent-guard/context-digest-policy.yaml \
            --format json \
            --output "$report"
          report_status=$?
          set -e
          # Exit 1 is a generated diagnostic report with findings, not a fatal error.
          test "$report_status" -le 1
          test -f "$report"
          python -m agent_guard.consumer "$report"

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.4', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Check changelog entry
        if: matrix.python-version == '3.12'
        run: python scripts/check_changelog.py
      - name: Run tests
        run: pytest
      - name: Replay 15-minute onboarding path
        if: matrix.python-version == '3.14'
        env:
          AGENT_GUARD_TTFE_OUT: /tmp/agent-guard-ttfe.json
        run: |
          PYTHON="$(command -v python)" bash bench/ttfe/run.sh
          python -m bench.ttfe.run check \
            --input /tmp/agent-guard-ttfe.json \
            --max-elapsed-ms 900000
      - name: Validate pre-commit hook manifest
        if: matrix.python-version == '3.12'
        run: pre-commit validate-manifest
      - name: Run CLI smoke tests
        run: |
          python -m agent_guard.cli content check \
            --repo-root . \
            --policy examples/content_security_policy.yaml \
            --mode registered \
            --scan-dir . \
            --json
          python -m agent_guard.cli context check --root . --policy examples/agent_context_policy.yaml --json
          python -m agent_guard.cli context lock \
            --root . \
            --policy examples/agent_context_policy.yaml > /tmp/agent-guard-context-lock.yaml
          python -m agent_guard.cli digest check --root . --policy /tmp/agent-guard-context-lock.yaml --json
          python -m agent_guard.cli path check --root . --policy examples/ai_resilience_path_policy.yaml --json
          mkdir -p /tmp/agent-guard-digest-smoke
          printf 'pinned\n' > /tmp/agent-guard-digest-smoke/pinned.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("/tmp/agent-guard-digest-smoke")
          digest = hashlib.sha256((root / "pinned.txt").read_bytes()).hexdigest()
          (root / "policy.yaml").write_text(
              "checks:\n"
              "  - id: pinned_text\n"
              "    path: pinned.txt\n"
              f"    sha256: '{digest}'\n",
              encoding="utf-8",
          )
          PY
          python -m agent_guard.cli digest check \
            --root /tmp/agent-guard-digest-smoke \
            --policy /tmp/agent-guard-digest-smoke/policy.yaml \
            --json
          python -m agent_guard.cli mcp check --root . --policy .agent-guard/mcp-policy.yaml --json
          python -m agent_guard.cli workflow check --root . --policy examples/workflow_policy.yaml --json
      - name: Run self-dogfood evidence gates
        run: |
          mkdir -p .agent-guard/evidence
          python -m agent_guard.cli path check --root . --policy .agent-guard/path-policy.yaml --json
          python -m agent_guard.cli context check --root . --policy .agent-guard/context-policy.yaml --json
          python -m agent_guard.cli context lock \
            --root . \
            --policy .agent-guard/context-policy.yaml > /tmp/agent-guard-self-context-lock.yaml
          python -m agent_guard.cli context lock \
            --root . \
            --policy .agent-guard/context-policy.yaml \
            --check \
            --digest-policy .agent-guard/context-digest-policy.yaml \
            --json
          python -m agent_guard.cli digest check --root . --policy /tmp/agent-guard-self-context-lock.yaml --json
          python -m agent_guard.cli digest check --root . --policy .agent-guard/context-digest-policy.yaml --json
          python -m agent_guard.cli content check \
            --repo-root . \
            --policy .agent-guard/content-policy.yaml \
            --mode registered \
            --scan-dir . \
            --json
          python -m agent_guard.cli mcp check --root . --policy .agent-guard/mcp-policy.yaml --json
          python -m agent_guard.cli workflow check --root . --policy .agent-guard/workflow-policy.yaml --json
          python -m agent_guard.cli surface inventory \
            --root . \
            --context-policy .agent-guard/context-policy.yaml \
            --schema-version v2 \
            --json > .agent-guard/evidence/agent-surface-inventory.json
          python -m agent_guard.cli drift check --root . --profile recommended --schema-version v2 --json
          python -m agent_guard.cli report \
            --root . \
            --context-policy .agent-guard/context-policy.yaml \
            --evidence-preset recommended \
            --api-policy examples/architecture_policy.yaml \
            --mcp-policy .agent-guard/mcp-policy.yaml \
            --digest-policy .agent-guard/context-digest-policy.yaml \
            --format json \
            --output .agent-guard/evidence/agent-guard-report.json
          python -m agent_guard.cli render-report \
            --root . \
            --input .agent-guard/evidence/agent-guard-report.json \
            --format markdown \
            --output .agent-guard/evidence/agent-guard-report.md
          python -m agent_guard.cli render-report \
            --root . \
            --input .agent-guard/evidence/agent-guard-report.json \
            --format sarif \
            --output .agent-guard/evidence/agent-guard-results.sarif
          python -m agent_guard.cli conformance check \
            --root . \
            --evidence .agent-guard/evidence/agent-guard-report.json \
            --profile recommended \
            --json
          python -m agent_guard.cli evidence-pack manifest \
            --root . \
            --report .agent-guard/evidence/agent-guard-report.json \
            --artifact .agent-guard/evidence/agent-guard-report.json \
            --json
          python -m agent_guard.cli render-report \
            --root . \
            --input .agent-guard/evidence/agent-guard-report.json \
            --format github-annotations
          python -I -m agent_guard.consumer \
            --evidence-dir .agent-guard/evidence \
            .agent-guard/evidence/agent-guard-report.json
      - name: Upload self-dogfood evidence report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-guard-evidence-report
          path: .agent-guard/evidence/
          if-no-files-found: error

  required-ci:
    name: agent-guard required CI
    if: ${{ always() }}
    needs:
      - actionlint
      - release-contract
      - action-smoke-status
      - windows-cli-smoke
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI contract to pass
        env:
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          RELEASE_CONTRACT_RESULT: ${{ needs.release-contract.result }}
          ACTION_SMOKE_RESULT: ${{ needs.action-smoke-status.result }}
          WINDOWS_CLI_RESULT: ${{ needs.windows-cli-smoke.result }}
          PYTEST_MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          test "$ACTIONLINT_RESULT" = "success"
          test "$RELEASE_CONTRACT_RESULT" = "success"
          test "$ACTION_SMOKE_RESULT" = "success"
          test "$WINDOWS_CLI_RESULT" = "success"
          test "$PYTEST_MATRIX_RESULT" = "success"
