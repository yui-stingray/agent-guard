# Where: .github/workflows/ci.yml
# What: run workflow linting, tests, and packaging checks on every push to master and every PR.
# Why: keep the extracted guard package safe while the API surface is still moving.

name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [master]
  pull_request:

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: devops-actions/actionlint@v0.1.11

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Check changelog entry
        if: matrix.python-version == '3.12'
        run: python scripts/check_changelog.py
      - name: Run tests
        run: pytest
      - name: Validate pre-commit hook manifest
        if: matrix.python-version == '3.12'
        run: pre-commit validate-manifest
      - name: Run CLI smoke tests
        run: |
          python -m agent_guard.cli content check --repo-root . --policy examples/content_security_policy.yaml --mode registered --scan-dir . --json
          python -m agent_guard.cli context check --root . --policy examples/agent_context_policy.yaml --json
          python -m agent_guard.cli context lock --root . --policy examples/agent_context_policy.yaml > /tmp/agent-guard-context-lock.yaml
          python -m agent_guard.cli digest check --root . --policy /tmp/agent-guard-context-lock.yaml --json
          python -m agent_guard.cli path check --root . --policy examples/ai_resilience_path_policy.yaml --json
          mkdir -p /tmp/agent-guard-digest-smoke
          printf 'pinned\n' > /tmp/agent-guard-digest-smoke/pinned.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("/tmp/agent-guard-digest-smoke")
          digest = hashlib.sha256((root / "pinned.txt").read_bytes()).hexdigest()
          (root / "policy.yaml").write_text(
              "checks:\n"
              "  - id: pinned_text\n"
              "    path: pinned.txt\n"
              f"    sha256: '{digest}'\n",
              encoding="utf-8",
          )
          PY
          python -m agent_guard.cli digest check --root /tmp/agent-guard-digest-smoke --policy /tmp/agent-guard-digest-smoke/policy.yaml --json
          python -m agent_guard.cli mcp check --root . --policy .agent-guard/mcp-policy.yaml --json
          python -m agent_guard.cli workflow check --root . --policy examples/workflow_policy.yaml --json
      - name: Run self-dogfood evidence gates
        run: |
          mkdir -p .agent-guard/evidence
          python -m agent_guard.cli path check --root . --policy .agent-guard/path-policy.yaml --json
          python -m agent_guard.cli context check --root . --policy .agent-guard/context-policy.yaml --json
          python -m agent_guard.cli context lock --root . --policy .agent-guard/context-policy.yaml > /tmp/agent-guard-self-context-lock.yaml
          python -m agent_guard.cli context lock --root . --policy .agent-guard/context-policy.yaml --check --digest-policy .agent-guard/context-digest-policy.yaml --json
          python -m agent_guard.cli digest check --root . --policy /tmp/agent-guard-self-context-lock.yaml --json
          python -m agent_guard.cli digest check --root . --policy .agent-guard/context-digest-policy.yaml --json
          python -m agent_guard.cli content check --repo-root . --policy .agent-guard/content-policy.yaml --mode registered --scan-dir . --json
          python -m agent_guard.cli mcp check --root . --policy .agent-guard/mcp-policy.yaml --json
          python -m agent_guard.cli workflow check --root . --policy .agent-guard/workflow-policy.yaml --json
          python -m agent_guard.cli surface inventory --root . --context-policy .agent-guard/context-policy.yaml --schema-version v2 --json > .agent-guard/evidence/agent-surface-inventory.json
          python -m agent_guard.cli drift check --root . --profile recommended --schema-version v2 --json
          python -m agent_guard.cli report --root . --context-policy .agent-guard/context-policy.yaml --evidence-preset recommended --api-policy examples/architecture_policy.yaml --mcp-policy .agent-guard/mcp-policy.yaml --digest-policy .agent-guard/context-digest-policy.yaml --format json --output .agent-guard/evidence/agent-guard-evidence-report.json
          python -m agent_guard.cli render-report --root . --input .agent-guard/evidence/agent-guard-evidence-report.json --format markdown --output .agent-guard/evidence/agent-guard-evidence-report.md
          python -m agent_guard.cli render-report --root . --input .agent-guard/evidence/agent-guard-evidence-report.json --format sarif --output .agent-guard/evidence/agent-guard-results.sarif
          python -m agent_guard.cli conformance check --root . --evidence .agent-guard/evidence/agent-guard-evidence-report.json --profile recommended --json
          python -m agent_guard.cli evidence-pack manifest --root . --report .agent-guard/evidence/agent-guard-evidence-report.json --artifact .agent-guard/evidence/agent-guard-evidence-report.json --json
          python -m agent_guard.cli render-report --root . --input .agent-guard/evidence/agent-guard-evidence-report.json --format github-annotations
      - name: Upload self-dogfood evidence report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-guard-evidence-report
          path: .agent-guard/evidence/
          if-no-files-found: error
      - name: Build sdist + wheel
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Verify metadata (twine check)
        if: matrix.python-version == '3.12'
        run: python -m twine check dist/*
      - name: Verify wheel public contract
        if: matrix.python-version == '3.12'
        run: python scripts/check_wheel_contract.py
